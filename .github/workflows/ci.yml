name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      SYSTEM_DEPS_DAV1D_BUILD_INTERNAL: auto
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Windows'
        run: winget install --id bloodrock.pkg-config-lite -e --silent --accept-source-agreements --accept-package-agreements
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nasmDir = Join-Path $env:RUNNER_TEMP 'nasm'
          New-Item -ItemType Directory -Force -Path $nasmDir | Out-Null
          Invoke-WebRequest 'https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip' -OutFile (Join-Path $nasmDir 'nasm.zip')
          Expand-Archive (Join-Path $nasmDir 'nasm.zip') -DestinationPath $nasmDir -Force
          Add-Content $env:GITHUB_PATH (Join-Path $nasmDir 'nasm-3.02')
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev pkg-config nasm
      - if: runner.os == 'macOS'
        run: brew install nasm
      - run: python -m pip install meson ninja
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: pixelforge-${{ matrix.os }}
          path: |
            dist/pixelforge-windows-x64.zip
            target/release/pixelforge-desktop*
            target/release/pixelforge

